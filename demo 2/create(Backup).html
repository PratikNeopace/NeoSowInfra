<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Quotation - User Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            min-height:100vh; 
        }
        .container-card { 
            max-width:1200px; 
            margin:40px auto; 
            background:white; 
            padding:30px; 
            border-radius:12px; 
            box-shadow:0 10px 40px rgba(0,0,0,0.15); 
        }
        .form-row { gap:12px; }
        .table-wrap { overflow:auto; margin: 20px 0; }
        .action-btn { margin-right:6px; }
        
        /* Header Styles */
        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #f0f0f0;
        }

        .header-section h2 {
            color: #667eea;
            font-weight: 700;
            margin: 0;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .btn-back {
            background: #6c757d;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }

        .btn-back:hover {
            background: #5a6268;
            color: white;
            text-decoration: none;
        }

        /* Customer Info Section */
        .customer-info-section {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 25px;
        }

        .customer-info-section h5 {
            color: #667eea;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .customer-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
        }

        .customer-field {
            display: flex;
            flex-direction: column;
        }

        .customer-field label {
            font-weight: 600;
            color: #667eea;
            margin-bottom: 5px;
            font-size: 13px;
        }

        .customer-field input {
            border: 1px solid #dee2e6;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
        }

        /* Form Section */
        .form-section {
            background: white;
            border: 1px solid #dee2e6;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 25px;
        }

        .form-section h5 {
            color: #667eea;
            font-weight: 700;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Table Styles */
        .table {
            margin-bottom: 0;
        }

        .table thead th {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-weight: 600;
            border: none;
        }

        .table tbody tr:hover {
            background-color: #f8f9fa;
        }

        /* Action Buttons */
        .btn-add {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
        }

        .btn-add:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
            color: white;
        }

        /* Summary Section */
        .summary-section {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 25px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            font-size: 16px;
        }

        .summary-row:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .summary-label {
            font-weight: 600;
        }

        .summary-value {
            font-weight: 700;
            font-size: 18px;
        }

        /* Action Buttons Section */
        .action-section {
            display: flex;
            gap: 12px;
            margin-top: 25px;
            flex-wrap: wrap;
        }

        .btn-view-quotation {
            flex: 1;
            min-width: 150px;
            background: #28a745;
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 15px;
        }

        .btn-view-quotation:hover {
            background: #218838;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(40, 167, 69, 0.3);
            color: white;
            text-decoration: none;
        }

        .btn-download-pdf {
            flex: 1;
            min-width: 150px;
            background: #fd7e14;
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 15px;
        }

        .btn-download-pdf:hover {
            background: #e6690d;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(253, 126, 20, 0.3);
            color: white;
            text-decoration: none;
        }

        .btn-save-customer {
            flex: 1;
            min-width: 150px;
            background: #667eea;
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 15px;
        }

        .btn-save-customer:hover {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
            color: white;
            text-decoration: none;
        }

        /* Modal Styles */
        .modal-content {
            border: none;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
        }

        .modal-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
        }

        .modal-title {
            font-weight: 700;
        }

        .btn-close {
            filter: brightness(0) invert(1);
        }

        @media (max-width: 768px) {
            .action-section {
                flex-direction: column;
            }

            .btn-view-quotation, .btn-download-pdf, .btn-save-customer {
                width: 100%;
            }

            .header-section {
                flex-direction: column;
                align-items: flex-start;
            }

            .table {
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container container-card">
        <!-- Header -->
        <div class="header-section">
            <h2><i class="fas fa-file-invoice"></i> Create Quotation</h2>
            <div class="header-actions">
                <a href="home.html" class="btn-back">
                    <i class="fas fa-arrow-left"></i> Back to Home
                </a>
            </div>
        </div>

        <!-- Customer Information -->
        <div class="customer-info-section">
            <h5><i class="fas fa-user"></i> Customer Details</h5>
            <div class="customer-row">
                <div class="customer-field">
                    <label>Customer Name *</label>
                    <input id="customerName" type="text" placeholder="Enter customer name" required>
                </div>
                <div class="customer-field">
                    <label>Email Address</label>
                    <input id="customerEmail" type="email" placeholder="Enter email address">
                </div>
                <div class="customer-field">
                    <label>Phone Number</label>
                    <input id="customerPhone" type="tel" placeholder="Enter phone number">
                </div>
            </div>
        </div>

        <!-- Item Form -->
        <div class="form-section">
            <h5><i class="fas fa-plus"></i> Add Items</h5>
            <form id="itemForm">
                <div class="row form-row">
                    <div class="col-md-3 mb-2">
                        <label class="form-label">Unit</label>
                        <select id="unitSelect" class="form-select">
                            <option value="meter">Meter</option>
                            <option value="sqmeter">Sq. Meter</option>
                            <option value="piece">Piece</option>
                            <option value="linearmeter">Linear Meter</option>
                        </select>
                    </div>

                    <div class="col-md-3 mb-2">
                        <label class="form-label">Category</label>
                        <select id="categorySelect" class="form-select" required>
                            <option value="">-- Select Category --</option>
                            <option value="partitions">Partitions</option>
                            <option value="doors">Doors</option>
                            <option value="windows">Windows</option>
                            <option value="ceilings">Ceilings</option>
                        </select>
                    </div>

                    <div class="col-md-3 mb-2" id="subWrap" style="display:none;">
                        <label class="form-label">Subcategory</label>
                        <select id="subSelect" class="form-select"></select>
                    </div>

                    <div class="col-md-3 mb-2">
                        <label class="form-label">Description</label>
                        <input id="descInput" class="form-control" placeholder="Description (optional)">
                    </div>

                    <div class="col-md-2 mb-2">
                        <label class="form-label">Width</label>
                        <input id="widthInput" type="number" class="form-control" min="0" step="0.01" placeholder="0">
                    </div>

                    <div class="col-md-2 mb-2">
                        <label class="form-label">Depth</label>
                        <input id="depthInput" type="number" class="form-control" min="0" step="0.01" placeholder="0">
                    </div>

                    <div class="col-md-2 mb-2">
                        <label class="form-label">Height</label>
                        <input id="heightInput" type="number" class="form-control" min="0" step="0.01" placeholder="0">
                    </div>

                    <div class="col-md-2 mb-2">
                        <label class="form-label">Quantity</label>
                        <input id="qtyInput" type="number" class="form-control" min="0" step="0.01" value="1">
                    </div>

                    <div class="col-md-2 mb-2">
                        <label class="form-label">Unit Rate</label>
                        <input id="rateInput" type="number" class="form-control" min="0" step="0.01" value="0">
                    </div>

                    <div class="col-md-12 d-flex justify-content-end mt-2">
                        <button type="submit" class="btn-add" id="addBtn">
                            <i class="fas fa-plus"></i> Add to Table
                        </button>
                    </div>
                </div>
            </form>
        </div>

        <!-- Items Table -->
        <div class="table-wrap">
            <table class="table table-bordered table-hover" id="itemsTable">
                <thead>
                    <tr>
                        <th>S.No</th>
                        <th>Category</th>
                        <th>Subcategory</th>
                        <th>Description</th>
                        <th>Width</th>
                        <th>Depth</th>
                        <th>Qty</th>
                        <th>Unit</th>
                        <th>Unit Rate</th>
                        <th>Amount</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="itemsTbody">
                </tbody>
            </table>
        </div>

        <!-- Summary -->
        <div class="summary-section" id="summarySection" style="display:none;">
            <div class="summary-row">
                <span class="summary-label">Subtotal:</span>
                <span class="summary-value">₹<span id="subtotal">0.00</span></span>
            </div>
            <div class="summary-row">
                <span class="summary-label">GST (18%):</span>
                <span class="summary-value">₹<span id="gst">0.00</span></span>
            </div>
            <div class="summary-row">
                <span class="summary-label">Total Amount:</span>
                <span class="summary-value">₹<span id="totalAmount">0.00</span></span>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="action-section" id="actionSection" style="display:none;">
            <button class="btn-view-quotation" onclick="viewQuotation()">
                <i class="fas fa-eye"></i> View Quotation
            </button>
            <button class="btn-download-pdf" onclick="downloadPDF()">
                <i class="fas fa-download"></i> Download PDF
            </button>
            <button class="btn-save-customer" onclick="saveCustomer()">
                <i class="fas fa-save"></i> Save & Go Back
            </button>
        </div>
    </div>

    <!-- Edit Modal -->
    <div class="modal fade" id="editModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title"><i class="fas fa-edit"></i> Edit Item</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <form id="editForm">
                <input type="hidden" id="editIndex">
                <div class="mb-2">
                    <label class="form-label">Description</label>
                    <input id="editDesc" class="form-control">
                </div>
                <div class="row">
                    <div class="col-6 mb-2">
                        <label class="form-label">Qty</label>
                        <input id="editQty" type="number" class="form-control" min="0" step="0.01">
                    </div>
                    <div class="col-6 mb-2">
                        <label class="form-label">Unit Rate</label>
                        <input id="editRate" type="number" class="form-control" min="0" step="0.01">
                    </div>
                </div>
            </form>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="button" class="btn btn-primary" id="saveEdit">Save changes</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Quotation View Modal -->
    <div class="modal fade" id="quotationModal" tabindex="-1">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title"><i class="fas fa-file-invoice-dollar"></i> Quotation</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div id="quotationContent"></div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <script>
        const categoryMap = {
            partitions: ['Glass Partition','Gypsum Partition','Wooden Partition'],
            doors: ['Single Door','Double Door','Sliding Door'],
            windows: ['Sliding Window','Casement Window','Fixed Window'],
            ceilings: ['POP Ceiling','Grid Ceiling','Gypsum Ceiling']
        };

        const unitSelect = document.getElementById('unitSelect');
        const categorySelect = document.getElementById('categorySelect');
        const subWrap = document.getElementById('subWrap');
        const subSelect = document.getElementById('subSelect');
        const itemForm = document.getElementById('itemForm');
        const itemsTbody = document.getElementById('itemsTbody');
        const summarySection = document.getElementById('summarySection');
        const actionSection = document.getElementById('actionSection');

        let items = JSON.parse(localStorage.getItem('createItems') || '[]');
        let currentCustomerId = localStorage.getItem('currentCustomerId');

        // Load customer info if editing
        function loadCustomerInfo() {
            if (currentCustomerId !== null && currentCustomerId !== 'null') {
                const customers = JSON.parse(localStorage.getItem('customers') || '[]');
                const customer = customers[parseInt(currentCustomerId)];
                if (customer) {
                    document.getElementById('customerName').value = customer.name || '';
                    document.getElementById('customerEmail').value = customer.email || '';
                    document.getElementById('customerPhone').value = customer.phone || '';
                }
            }
        }

        function populateSubcats(cat) {
            subSelect.innerHTML = '';
            if (!cat || !categoryMap[cat]) return;
            categoryMap[cat].forEach(sub => {
                const opt = document.createElement('option');
                opt.value = sub;
                opt.textContent = sub;
                subSelect.appendChild(opt);
            });
        }

        categorySelect.addEventListener('change', function() {
            const val = this.value;
            if (val && categoryMap[val]) {
                populateSubcats(val);
                subWrap.style.display = 'block';
            } else {
                subWrap.style.display = 'none';
            }
        });

        function renderTable() {
            itemsTbody.innerHTML = '';
            items.forEach((it, idx) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${idx+1}</td>
                    <td>${it.category}</td>
                    <td>${it.sub || '-'}</td>
                    <td>${it.description || '-'}</td>
                    <td>${it.width || '-'}</td>
                    <td>${it.depth || '-'}</td>
                    <td>${it.qty}</td>
                    <td>${it.unit}</td>
                    <td>₹${Number(it.unitRate).toFixed(2)}</td>
                    <td>₹${Number(it.amount).toFixed(2)}</td>
                    <td>
                        <button class="btn btn-sm btn-outline-primary action-btn" type="button" data-action="edit" data-index="${idx}">Edit</button>
                        <button class="btn btn-sm btn-outline-danger" type="button" data-action="delete" data-index="${idx}">Delete</button>
                    </td>
                `;
                itemsTbody.appendChild(tr);
            });
            updateSummary();
        }

        function updateSummary() {
            const subtotal = items.reduce((sum, item) => sum + (item.amount || 0), 0);
            const gst = subtotal * 0.18;
            const total = subtotal + gst;

            document.getElementById('subtotal').textContent = subtotal.toFixed(2);
            document.getElementById('gst').textContent = gst.toFixed(2);
            document.getElementById('totalAmount').textContent = total.toFixed(2);

            if (items.length > 0) {
                summarySection.style.display = 'block';
                actionSection.style.display = 'flex';
            } else {
                summarySection.style.display = 'none';
                actionSection.style.display = 'none';
            }
        }

        function saveItems() { localStorage.setItem('createItems', JSON.stringify(items)); }

        itemForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const category = categorySelect.value;
            if (!category) { alert('Select a category'); return; }
            const sub = subSelect.value || '';
            const desc = document.getElementById('descInput').value.trim();
            const width = document.getElementById('widthInput').value;
            const depth = document.getElementById('depthInput').value;
            const qty = parseFloat(document.getElementById('qtyInput').value) || 0;
            const unit = unitSelect.value;
            const unitRate = parseFloat(document.getElementById('rateInput').value) || 0;
            const amount = qty * unitRate;

            const item = { category, sub, description: desc, width, depth, qty, unit, unitRate, amount };
            items.push(item);
            saveItems();
            renderTable();
            itemForm.reset();
            subWrap.style.display = 'none';
        });

        itemsTbody.addEventListener('click', function(e) {
            const btn = e.target.closest('button');
            if (!btn) return;
            const action = btn.getAttribute('data-action');
            const index = Number(btn.getAttribute('data-index'));
            if (action === 'edit') openEditModal(index);
            if (action === 'delete') {
                if (confirm('Delete this item?')) {
                    items.splice(index,1);
                    saveItems();
                    renderTable();
                }
            }
        });

        const editModalEl = document.getElementById('editModal');
        const editModal = new bootstrap.Modal(editModalEl);
        function openEditModal(index) {
            const it = items[index];
            document.getElementById('editIndex').value = index;
            document.getElementById('editDesc').value = it.description || '';
            document.getElementById('editQty').value = it.qty;
            document.getElementById('editRate').value = it.unitRate;
            editModal.show();
        }

        document.getElementById('saveEdit').addEventListener('click', function() {
            const idx = Number(document.getElementById('editIndex').value);
            const desc = document.getElementById('editDesc').value.trim();
            const qty = parseFloat(document.getElementById('editQty').value) || 0;
            const rate = parseFloat(document.getElementById('editRate').value) || 0;
            items[idx].description = desc;
            items[idx].qty = qty;
            items[idx].unitRate = rate;
            items[idx].amount = qty * rate;
            saveItems();
            renderTable();
            editModal.hide();
        });

        // View Quotation
        function viewQuotation() {
            const quotationContent = document.getElementById('quotationContent');
            const subtotal = items.reduce((sum, item) => sum + (item.amount || 0), 0);
            const gst = subtotal * 0.18;
            const total = subtotal + gst;

            quotationContent.innerHTML = `
                <div style="font-family: Arial; color: #333;">
                    <div style="text-align: center; margin-bottom: 30px; border-bottom: 2px solid #667eea; padding-bottom: 20px;">
                        <h2 style="color: #667eea; margin: 0;">QUOTATION</h2>
                        <p style="color: #6c757d; margin: 5px 0;">Professional Invoice & Quotation</p>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px;">
                        <div>
                            <h5 style="color: #667eea; margin-bottom: 10px;">Bill To:</h5>
                            <p style="margin: 5px 0;"><strong>${document.getElementById('customerName').value || 'Customer'}</strong></p>
                            <p style="margin: 5px 0; color: #6c757d;">${document.getElementById('customerEmail').value || 'Email: N/A'}</p>
                            <p style="margin: 5px 0; color: #6c757d;">${document.getElementById('customerPhone').value || 'Phone: N/A'}</p>
                        </div>
                        <div style="text-align: right;">
                            <p style="margin: 5px 0;"><strong>Date:</strong> ${new Date().toLocaleDateString()}</p>
                            <p style="margin: 5px 0;"><strong>Reference:</strong> QT-${Math.floor(Math.random()*10000)}</p>
                        </div>
                    </div>

                    <table style="width: 100%; border-collapse: collapse; margin-bottom: 20px;">
                        <thead>
                            <tr style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white;">
                                <th style="padding: 12px; text-align: left; border: 1px solid #dee2e6;">Item</th>
                                <th style="padding: 12px; text-align: center; border: 1px solid #dee2e6;">Qty</th>
                                <th style="padding: 12px; text-align: right; border: 1px solid #dee2e6;">Unit Rate</th>
                                <th style="padding: 12px; text-align: right; border: 1px solid #dee2e6;">Amount</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${items.map(item => `
                                <tr>
                                    <td style="padding: 12px; border: 1px solid #dee2e6;">
                                        <strong>${item.category}</strong><br>
                                        ${item.sub ? '<small>' + item.sub + '</small><br>' : ''}
                                        <small style="color: #6c757d;">${item.description || '-'}</small>
                                    </td>
                                    <td style="padding: 12px; text-align: center; border: 1px solid #dee2e6;">${item.qty}</td>
                                    <td style="padding: 12px; text-align: right; border: 1px solid #dee2e6;">₹${Number(item.unitRate).toFixed(2)}</td>
                                    <td style="padding: 12px; text-align: right; border: 1px solid #dee2e6;">₹${Number(item.amount).toFixed(2)}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>

                    <div style="text-align: right; margin-bottom: 30px;">
                        <div style="display: inline-block; min-width: 250px;">
                            <div style="display: flex; justify-content: space-between; padding: 10px; border-top: 2px solid #667eea; border-bottom: 2px solid #667eea; margin-bottom: 10px;">
                                <strong>Subtotal:</strong>
                                <strong>₹${subtotal.toFixed(2)}</strong>
                            </div>
                            <div style="display: flex; justify-content: space-between; padding: 10px; margin-bottom: 10px;">
                                <strong>GST (18%):</strong>
                                <strong>₹${gst.toFixed(2)}</strong>
                            </div>
                            <div style="display: flex; justify-content: space-between; padding: 12px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border-radius: 6px; font-size: 18px;">
                                <strong>TOTAL:</strong>
                                <strong>₹${total.toFixed(2)}</strong>
                            </div>
                        </div>
                    </div>

                    <div style="background: #f8f9fa; padding: 15px; border-radius: 6px; margin-top: 20px; border-left: 4px solid #667eea;">
                        <p style="color: #6c757d; margin: 0; font-size: 12px;">
                            <strong>Terms & Conditions:</strong> This quotation is valid for 30 days. Please confirm your order by email.<br>
                            Thank you for your business!
                        </p>
                    </div>
                </div>
            `;

            const quotationModal = new bootstrap.Modal(document.getElementById('quotationModal'));
            quotationModal.show();
        }

        // Download PDF
        function downloadPDF() {
            const element = document.createElement('div');
            const subtotal = items.reduce((sum, item) => sum + (item.amount || 0), 0);
            const gst = subtotal * 0.18;
            const total = subtotal + gst;

            element.innerHTML = `
                <div style="font-family: Arial; color: #333; padding: 20px;">
                    <div style="text-align: center; margin-bottom: 30px; border-bottom: 2px solid #667eea; padding-bottom: 20px;">
                        <h2 style="color: #667eea; margin: 0;">QUOTATION</h2>
                        <p style="color: #6c757d; margin: 5px 0;">Professional Invoice & Quotation</p>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px;">
                        <div>
                            <h5 style="color: #667eea; margin-bottom: 10px;">Bill To:</h5>
                            <p style="margin: 5px 0;"><strong>${document.getElementById('customerName').value || 'Customer'}</strong></p>
                            <p style="margin: 5px 0; color: #6c757d;">${document.getElementById('customerEmail').value || 'Email: N/A'}</p>
                            <p style="margin: 5px 0; color: #6c757d;">${document.getElementById('customerPhone').value || 'Phone: N/A'}</p>
                        </div>
                        <div style="text-align: right;">
                            <p style="margin: 5px 0;"><strong>Date:</strong> ${new Date().toLocaleDateString()}</p>
                            <p style="margin: 5px 0;"><strong>Reference:</strong> QT-${Math.floor(Math.random()*10000)}</p>
                        </div>
                    </div>

                    <table style="width: 100%; border-collapse: collapse; margin-bottom: 20px;">
                        <thead>
                            <tr style="background: #667eea; color: white;">
                                <th style="padding: 12px; text-align: left; border: 1px solid #dee2e6;">Item</th>
                                <th style="padding: 12px; text-align: center; border: 1px solid #dee2e6;">Qty</th>
                                <th style="padding: 12px; text-align: right; border: 1px solid #dee2e6;">Unit Rate</th>
                                <th style="padding: 12px; text-align: right; border: 1px solid #dee2e6;">Amount</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${items.map(item => `
                                <tr>
                                    <td style="padding: 12px; border: 1px solid #dee2e6;">
                                        <strong>${item.category}</strong><br>
                                        ${item.sub ? '<small>' + item.sub + '</small><br>' : ''}
                                        <small style="color: #6c757d;">${item.description || '-'}</small>
                                    </td>
                                    <td style="padding: 12px; text-align: center; border: 1px solid #dee2e6;">${item.qty}</td>
                                    <td style="padding: 12px; text-align: right; border: 1px solid #dee2e6;">₹${Number(item.unitRate).toFixed(2)}</td>
                                    <td style="padding: 12px; text-align: right; border: 1px solid #dee2e6;">₹${Number(item.amount).toFixed(2)}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>

                    <div style="text-align: right;">
                        <div style="display: inline-block; min-width: 250px;">
                            <div style="display: flex; justify-content: space-between; padding: 10px; border-top: 2px solid #667eea; border-bottom: 2px solid #667eea; margin-bottom: 10px;">
                                <strong>Subtotal:</strong>
                                <strong>₹${subtotal.toFixed(2)}</strong>
                            </div>
                            <div style="display: flex; justify-content: space-between; padding: 10px; margin-bottom: 10px;">
                                <strong>GST (18%):</strong>
                                <strong>₹${gst.toFixed(2)}</strong>
                            </div>
                            <div style="display: flex; justify-content: space-between; padding: 12px; background: #667eea; color: white; border-radius: 6px; font-size: 18px;">
                                <strong>TOTAL:</strong>
                                <strong>₹${total.toFixed(2)}</strong>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            const opt = {
                margin: 10,
                filename: `quotation-${document.getElementById('customerName').value || 'customer'}-${Date.now()}.pdf`,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2 },
                jsPDF: { orientation: 'portrait', unit: 'mm', format: 'a4' }
            };

            html2pdf().set(opt).from(element).save();
        }

        // Save Customer
        function saveCustomer() {
            const customerName = document.getElementById('customerName').value.trim();
            if (!customerName) {
                alert('Please enter customer name');
                return;
            }

            if (items.length === 0) {
                alert('Please add at least one item');
                return;
            }

            const customer = {
                name: customerName,
                email: document.getElementById('customerEmail').value,
                phone: document.getElementById('customerPhone').value,
                items: items,
                createdAt: new Date().toLocaleDateString()
            };

            let customers = JSON.parse(localStorage.getItem('customers') || '[]');

            if (currentCustomerId !== null && currentCustomerId !== 'null') {
                customers[parseInt(currentCustomerId)] = customer;
            } else {
                customers.push(customer);
            }

            localStorage.setItem('customers', JSON.stringify(customers));
            alert('Customer quotation saved successfully!');
            window.location.href = 'home.html';
        }

        // Initialize
        loadCustomerInfo();
        renderTable();
    </script>
</body>
</html>
